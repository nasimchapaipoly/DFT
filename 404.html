<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Not Found</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #f3f4f6, #e5e7eb);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.box {
    background: white;
    padding: 40px 30px;
    border-radius: 15px;
    text-align: center;
    box-shadow: 0 10px 20px rgba(0,0,0,0.1);
}

h1 {
    font-size: 70px;
    color: #2563eb;
    margin: 0;
}

p {
    color: #555;
}

.btn {
    display: inline-block;
    margin-top: 15px;
    padding: 10px 20px;
    background: #2563eb;
    color: white;
    text-decoration: none;
    border-radius: 8px;
}

.count {
    margin-top: 10px;
    font-size: 14px;
}
</style>

</head>
<body>

<div class="box">
    <h1>404</h1>
    <p>Page not found</p>

    <a href="/" class="btn">Go Home</a>

    <div class="count">
        Redirecting in <span id="t">5</span>s
    </div>
</div>

<script>
let t = 5;
const el = document.getElementById("t");

setInterval(() => {
    t--;
    el.textContent = t;

    if (t <= 0) {
        window.location.href = "/";
    }
}, 1000);
</script>

</body>
</html>
