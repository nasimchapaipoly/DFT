<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NASIM-TV OTT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #0f111a; color: white; font-family: sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #161925; }
        ::-webkit-scrollbar-thumb { background: #f97316; border-radius: 10px; }
    </style>
</head>
<body>

    <div id="auth-screen" class="flex items-center justify-center min-h-screen bg-[#0f111a]">
        <div class="bg-[#161925] p-8 rounded-lg shadow-lg w-full max-w-md border border-gray-800">
            <h2 class="text-3xl font-bold mb-6 text-center text-orange-500 flex justify-center items-center gap-2">
                NASIM-TV <span class="bg-green-500 text-white text-sm px-2 py-1 rounded">OTT</span>
            </h2>
            
            <div class="flex flex-col gap-4">
                <input type="email" id="auth-email" placeholder="Email Address" class="p-3 bg-gray-800 rounded border border-gray-700 text-white focus:outline-none focus:border-orange-500">
                <input type="password" id="auth-password" placeholder="Password (Min 6 chars)" class="p-3 bg-gray-800 rounded border border-gray-700 text-white focus:outline-none focus:border-orange-500">
                
                <button type="button" id="login-btn" class="bg-orange-500 hover:bg-orange-600 p-3 rounded font-bold transition-all text-white shadow-lg">Login</button>
                <button type="button" id="register-btn" class="bg-gray-700 hover:bg-gray-600 p-3 rounded font-bold transition-all mt-2 text-white">Register as New User</button>
            </div>
            
            <div class="mt-4 text-center">
                <button type="button" id="reset-password-btn" class="text-gray-400 hover:text-white text-sm transition-colors">Forgot Password?</button>
            </div>
        </div>
    </div>

    <div id="main-screen" class="hidden flex-col md:flex-row min-h-screen">
        <div class="w-full md:w-64 bg-[#161925] p-4 flex flex-col gap-4 border-r border-gray-800 shadow-xl z-20">
            <h1 class="text-2xl font-bold tracking-wider text-white flex items-center gap-2">
                NASIM-TV <span class="bg-green-500 text-xs px-2 py-1 rounded text-black">OTT</span>
            </h1>
            
            <div class="bg-blue-600 rounded-lg p-4 mt-2 shadow-lg relative overflow-hidden">
                <div class="flex items-center gap-3 relative z-10">
                    <div class="w-10 h-10 rounded-full bg-white text-blue-600 flex items-center justify-center font-bold text-xl uppercase" id="user-avatar">U</div>
                    <div>
                        <p class="font-bold text-sm truncate w-32" id="user-display-email">User</p>
                        <p class="text-xs text-blue-200">VIP Premium Member</p>
                    </div>
                </div>
            </div>

            <nav class="mt-4 flex flex-col gap-2">
                <button class="text-left p-3 bg-gray-800 rounded text-orange-400 font-semibold flex gap-3 items-center">
                    <span>🏠</span> Home
                </button>
                <button class="text-left p-3 hover:bg-gray-800 rounded flex gap-3 items-center text-gray-300">
                    <span>🏁</span> Live Match
                </button>
                <button class="text-left p-3 hover:bg-gray-800 rounded flex gap-3 items-center text-gray-300">
                    <span>🎬</span> Movies Portal
                </button>
                <button id="show-admin-btn" class="hidden text-left p-3 bg-orange-600 hover:bg-orange-700 rounded text-white font-bold flex gap-3 items-center mt-2 shadow-lg">
                    <span>⚙️</span> Admin Panel
                </button>
                <button id="logout-btn" class="text-left p-3 text-red-400 hover:bg-red-500/20 rounded mt-auto flex gap-3 items-center transition-colors">
                    <span>🚪</span> Logout Session
                </button>
            </nav>
        </div>

        <div class="flex-1 p-4 md:p-6 overflow-y-auto h-screen relative bg-[#0f111a]">
            
            <div class="w-full aspect-video bg-black rounded-lg overflow-hidden relative shadow-2xl mb-6 group border border-gray-800">
                <video id="video-player" controls autoplay class="w-full h-full object-contain"></video>
                <div id="now-playing" class="absolute top-4 left-4 bg-black/70 px-3 py-1.5 rounded text-sm text-orange-400 font-bold hidden backdrop-blur-md z-10 border border-gray-700">
                    NOW PLAYING: <span class="text-white ml-1"></span>
                </div>
                <div class="absolute top-4 right-4 bg-orange-600/90 px-2 py-1 rounded text-xs text-white font-bold z-10 hidden group-hover:block transition-all shadow-lg">
                    🌐 NATIVE DRM
                </div>
            </div>

            <div class="flex gap-3 overflow-x-auto my-4 pb-2 scrollbar-hide" id="category-filters">
                <button class="filter-btn px-5 py-2 rounded-full whitespace-nowrap bg-orange-500 text-white font-bold shadow-lg" data-cat="All">All</button>
                <button class="filter-btn px-5 py-2 rounded-full whitespace-nowrap bg-[#1e2233] text-gray-300 hover:bg-gray-700 font-semibold" data-cat="Bangladesh">Bangladesh</button>
                <button class="filter-btn px-5 py-2 rounded-full whitespace-nowrap bg-[#1e2233] text-gray-300 hover:bg-gray-700 font-semibold" data-cat="Sports">Sports</button>
                <button class="filter-btn px-5 py-2 rounded-full whitespace-nowrap bg-[#1e2233] text-gray-300 hover:bg-gray-700 font-semibold" data-cat="Islamic">Islamic</button>
                <button class="filter-btn px-5 py-2 rounded-full whitespace-nowrap bg-[#1e2233] text-gray-300 hover:bg-gray-700 font-semibold" data-cat="News">News</button>
                <button class="filter-btn px-5 py-2 rounded-full whitespace-nowrap bg-[#1e2233] text-gray-300 hover:bg-gray-700 font-semibold" data-cat="Movies">Movies</button>
                <button class="filter-btn px-5 py-2 rounded-full whitespace-nowrap bg-[#1e2233] text-gray-300 hover:bg-gray-700 font-semibold" data-cat="Kids">Kids</button>
            </div>

            <div id="channels-container" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 xl:grid-cols-7 gap-4 pb-20">
                </div>
        </div>
    </div>

    <div id="admin-screen" class="hidden flex-col min-h-screen bg-[#0f111a] p-4 md:p-8">
        <button id="back-to-tv-btn" class="mb-6 text-orange-500 font-bold hover:underline flex items-center gap-2">&larr; Back to Live TV</button>
        <h2 class="text-3xl font-bold mb-6">Admin Dashboard</h2>
        
        <div class="grid md:grid-cols-2 gap-8 max-w-4xl">
            <div class="flex flex-col gap-4 bg-[#161925] p-6 rounded-xl border border-gray-800 shadow-xl">
                <h3 class="text-xl font-bold text-white mb-2">Add Single Channel</h3>
                <input type="text" id="add-name" placeholder="Channel Name" class="p-3 bg-gray-800 rounded text-white border border-gray-700 focus:border-orange-500 outline-none">
                <input type="url" id="add-logo" placeholder="Logo Image URL" class="p-3 bg-gray-800 rounded text-white border border-gray-700 focus:border-orange-500 outline-none">
                <input type="url" id="add-url" placeholder="M3U8 Stream URL" class="p-3 bg-gray-800 rounded text-white border border-gray-700 focus:border-orange-500 outline-none">
                <select id="add-category" class="p-3 bg-gray-800 rounded text-white border border-gray-700 focus:border-orange-500 outline-none">
                    <option value="Bangladesh">Bangladesh</option>
                    <option value="Sports">Sports</option>
                    <option value="Islamic">Islamic</option>
                    <option value="News">News</option>
                    <option value="Movies">Movies</option>
                    <option value="Kids">Kids</option>
                    <option value="Entertainment">Entertainment</option>
                </select>
                <button type="button" id="admin-submit-btn" class="bg-green-500 hover:bg-green-600 p-3 rounded font-bold text-white shadow-lg transition-colors">Upload Channel</button>
            </div>

            <div class="p-6 bg-blue-900/10 border border-blue-500/30 rounded-xl shadow-xl h-fit">
                <h3 class="text-xl font-bold text-blue-400 mb-2">Bulk Actions</h3>
                <p class="text-sm text-gray-400 mb-6">Instantly upload 40+ categorized default channels to your database.</p>
                <button type="button" id="bulk-upload-btn" class="w-full bg-blue-600 hover:bg-blue-700 p-4 rounded font-bold text-white shadow-lg flex justify-center items-center gap-2 transition-colors">
                    ☁️ Bulk Upload All Default Channels
                </button>
            </div>
        </div>
    </div>

    <script>
        try {
            // আপনার সঠিক API Key এবং URL
            const SUPABASE_URL = 'https://hhnxgjqiavdnnwovlzom.supabase.co';
            const SUPABASE_ANON_KEY = 'sb_publishable_QbYdeLiP_gfBa09TI_8d8w_qlkUQjyH';

            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            const screens = {
                auth: document.getElementById('auth-screen'),
                main: document.getElementById('main-screen'),
                admin: document.getElementById('admin-screen')
            };
            const videoPlayer = document.getElementById('video-player');
            
            let currentHls = null;
            let isAdmin = false;
            let allChannelsData = [];
            let currentCategory = 'All';

            function showScreen(screenName) {
                Object.values(screens).forEach(s => s.classList.add('hidden'));
                screens[screenName].classList.remove('hidden');
                if(screenName === 'main') screens.main.classList.add('flex');
            }

            // ================= AUTHENTICATION =================
            const loginBtn = document.getElementById('login-btn');
            const registerBtn = document.getElementById('register-btn');
            const resetBtn = document.getElementById('reset-password-btn');

            loginBtn.addEventListener('click', async () => {
                try {
                    const email = document.getElementById('auth-email').value.trim();
                    const password = document.getElementById('auth-password').value;
                    
                    if(!email || !password) return alert("⚠️ Email and Password are required!");
                    
                    loginBtn.innerText = "Logging in...";
                    const { error } = await supabase.auth.signInWithPassword({ email, password });
                    
                    if (error) alert("❌ Login Error: " + error.message);
                } catch (err) {
                    alert("❌ System Error: " + err.message);
                } finally {
                    loginBtn.innerText = "Login";
                }
            });

            registerBtn.addEventListener('click', async () => {
                try {
                    const email = document.getElementById('auth-email').value.trim();
                    const password = document.getElementById('auth-password').value;
                    
                    if(!email || !password) return alert("⚠️ Email and Password are required!");
                    if(password.length < 6) return alert("⚠️ Password must be at least 6 characters.");
                    
                    registerBtn.innerText = "Registering...";
                    
                    const { data, error } = await supabase.auth.signUp({ email, password });

                    if (error) {
                        alert("❌ Registration Error: " + error.message);
                    } else if (data.user) {
                        const { error: dbError } = await supabase.from('users').insert([{ id: data.user.id, email: email, role: 'user' }]);
                        if (dbError) console.warn("DB Role Saving Issue (Usually RLS):", dbError.message);
                        alert("✅ Registration Successful! You can login now.");
                    }
                } catch (err) {
                    alert("❌ System Error: " + err.message);
                } finally {
                    registerBtn.innerText = "Register as New User";
                }
            });

            resetBtn.addEventListener('click', async () => {
                try {
                    const email = document.getElementById('auth-email').value.trim();
                    if(!email) return alert("⚠️ Please type your email in the box first.");

                    resetBtn.innerText = "Sending Link...";
                    const { error } = await supabase.auth.resetPasswordForEmail(email);
                    
                    if (error) alert("❌ Error: " + error.message);
                    else alert("✅ Password reset link sent to your email!");
                } catch (err) {
                    alert("❌ System Error: " + err.message);
                } finally {
                    resetBtn.innerText = "Forgot Password?";
                }
            });

            document.getElementById('logout-btn').addEventListener('click', async () => {
                await supabase.auth.signOut();
            });

            supabase.auth.onAuthStateChange(async (event, session) => {
                if (session?.user) {
                    document.getElementById('user-display-email').innerText = session.user.email.split('@')[0];
                    document.getElementById('user-avatar').innerText = session.user.email.charAt(0).toUpperCase();

                    const { data } = await supabase.from('users').select('role').eq('id', session.user.id).single();
                    isAdmin = data?.role === 'admin';
                    
                    document.getElementById('show-admin-btn').classList.toggle('hidden', !isAdmin);
                    showScreen('main');
                    loadChannels();
                } else {
                    showScreen('auth');
                    if(currentHls) currentHls.destroy();
                    videoPlayer.src = "";
                }
            });

            // ================= TV LOGIC & UI =================
            async function loadChannels() {
                const { data, error } = await supabase.from('channels').select('*').order('id', { ascending: false });
                if (error) return console.error("Error loading channels:", error);
                allChannelsData = data || [];
                renderChannels();
            }

            function renderChannels() {
                const container = document.getElementById('channels-container');
                container.innerHTML = '';
                
                const filtered = currentCategory === 'All' 
                    ? allChannelsData 
                    : allChannelsData.filter(c => c.category === currentCategory);

                if(filtered.length === 0) {
                    container.innerHTML = `<div class="col-span-full flex flex-col items-center justify-center py-16 opacity-50"><span class="text-4xl mb-3">📡</span><p>No channels found in this category.</p></div>`;
                    return;
                }

                filtered.forEach(ch => {
                    const div = document.createElement('div');
                    div.className = "bg-white rounded-xl p-2 cursor-pointer transition-all hover:scale-105 flex flex-col items-center justify-center aspect-square shadow-lg border border-gray-200 relative overflow-hidden group";
                    div.innerHTML = `
                        <div class="w-full h-3/4 flex items-center justify-center p-2 bg-white">
                            <img src="${ch.logo}" alt="${ch.name}" class="max-w-full max-h-full object-contain" onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/thumb/a/ac/No_image_available.svg/300px-No_image_available.svg.png'">
                        </div>
                        <div class="w-full h-1/4 bg-gray-100 flex items-center justify-center border-t border-gray-200">
                            <p class="text-[10px] sm:text-xs text-black font-bold text-center truncate w-full px-1">${ch.name}</p>
                        </div>
                        <div class="absolute inset-0 bg-black/50 hidden group-hover:flex items-center justify-center backdrop-blur-[1px] transition-all">
                            <span class="text-white bg-orange-500 rounded-full w-10 h-10 flex items-center justify-center pl-1 text-lg shadow-xl ring-4 ring-orange-500/30">▶</span>
                        </div>
                    `;
                    div.onclick = () => playStream(ch.url, ch.name);
                    container.appendChild(div);
                });
            }

            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.filter-btn').forEach(b => {
                        b.classList.remove('bg-orange-500', 'text-white');
                        b.classList.add('bg-[#1e2233]', 'text-gray-300');
                    });
                    e.target.classList.remove('bg-[#1e2233]', 'text-gray-300');
                    e.target.classList.add('bg-orange-500', 'text-white');
                    
                    currentCategory = e.target.getAttribute('data-cat');
                    renderChannels();
                });
            });

            supabase.channel('custom-all-channel')
              .on('postgres_changes', { event: '*', schema: 'public', table: 'channels' }, payload => {
                  loadChannels();
              }).subscribe();

            function playStream(url, name) {
                document.getElementById('now-playing').classList.remove('hidden');
                document.getElementById('now-playing').querySelector('span').innerText = name;
                
                window.scrollTo({ top: 0, behavior: 'smooth' });

                if (Hls.isSupported()) {
                    if(currentHls) currentHls.destroy();
                    currentHls = new Hls();
                    currentHls.loadSource(url);
                    currentHls.attachMedia(videoPlayer);
                    currentHls.on(Hls.Events.MANIFEST_PARSED, () => {
                        videoPlayer.play().catch(e => console.log("Autoplay blocked:", e));
                    });
                } else if (videoPlayer.canPlayType('application/vnd.apple.mpegurl')) {
                    videoPlayer.src = url;
                    videoPlayer.play().catch(e => console.log("Autoplay blocked:", e));
                }
            }

            // ================= ADMIN LOGIC =================
            document.getElementById('show-admin-btn').addEventListener('click', () => showScreen('admin'));
            document.getElementById('back-to-tv-btn').addEventListener('click', () => showScreen('main'));

            document.getElementById('admin-submit-btn').addEventListener('click', async () => {
                const name = document.getElementById('add-name').value.trim();
                const logo = document.getElementById('add-logo').value.trim();
                const url = document.getElementById('add-url').value.trim();
                
                if(!name || !logo || !url) return alert("Please fill all fields!");

                const btn = document.getElementById('admin-submit-btn');
                btn.innerText = "Uploading...";
                
                const channel = {
                    name: name,
                    logo: logo,
                    url: url,
                    category: document.getElementById('add-category').value
                };
                
                const { error } = await supabase.from('channels').insert([channel]);
                btn.innerText = "Upload Channel";
                
                if (error) alert("❌ Error: " + error.message);
                else {
                    alert("✅ Channel Added Successfully!");
                    document.getElementById('add-name').value = '';
                    document.getElementById('add-logo').value = '';
                    document.getElementById('add-url').value = '';
                }
            });

            document.getElementById('bulk-upload-btn').addEventListener('click', async () => {
                if(!confirm("Are you sure? This will add over 40 preset channels to your database.")) return;
                
                const btn = document.getElementById('bulk-upload-btn');
