<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DFT Live TV</title>
    
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@clappr/player@latest/dist/clappr.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/dash-shaka-playback@latest/dist/dash-shaka-playback.min.js"></script>
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        #player {
            width: 100% !important;
            height: 100% !important;
            max-width: 100vw;
            max-height: 100vh;
        }
        /* Make sure player interface scales cleanly on mobile screens */
        .clappr-video {
            background-color: #000 !important;
        }
    </style>
</head>
<body>

    <div id="player"></div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Target live stream link
            const targetMpd = "https://qp-pldt-live-bpk-ucd-prod.akamaized.net/bpk-tv/ch299/default/index.mpd";

            // Initialize the Clappr player layout identical to third-party streaming web links
            var player = new Clappr.Player({
                source: targetMpd,
                parentId: "#player",
                plugins: [DashShakaPlayback],
                shakaPlayback: {
                    // Tell the internal player routing engine to force pass credential headers
                    crossOrigin: 'anonymous'
                },
                preload: 'auto',
                autoPlay: true,
                muted: true, // Standard browser security requirement to allow autoplay execution
                width: '100%',
                height: '100%',
                mimeType: 'application/dash+xml',
                mediacontrol: { seekbar: '#007aff', buttons: '#ffffff' }
            });
        });
    </script>

</body>
</html>
