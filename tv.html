<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DFT Live TV - Secure Player</title>
    
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@clappr/player@latest/dist/clappr.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/dash-shaka-playback@latest/dist/dash-shaka-playback.min.js"></script>
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        #player {
            width: 100% !important;
            height: 100% !important;
        }
        .clappr-video {
            background-color: #000 !important;
        }
    </style>
</head>
<body>

    <div id="player"></div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Target encrypted stream
            const targetMpd = "https://qp-pldt-live-bpk-ucd-prod.akamaized.net/bpk-tv/ch299/default/index.mpd";

            var player = new Clappr.Player({
                source: targetMpd,
                parentId: "#player",
                plugins: [DashShakaPlayback],
                
                // This block maps configurations directly to the underlying Shaka core
                shakaPlayback: {
                    crossOrigin: 'anonymous',
                    
                    // PASSING REQUISITE DECRYPTION TO ELIMINATE THE 6012 ERROR
                    drm: {
                        servers: {
                            // This provides a fallback routing pattern for widevine decryption channels
                            'com.widevine.alpha': 'https://g84wmu.movielinkbd.li/drm-proxy' 
                        },
                        clearKeys: {
                            // Backup structural mapping if the source app tracks keys statically
                            // Format example: 'HexKeyID': 'HexDecryptionKey'
                        }
                    }
                },
                preload: 'auto',
                autoPlay: true,
                muted: true, // Crucial for mobile browser policy bypass rules
                width: '100%',
                height: '100%',
                mimeType: 'application/dash+xml'
            });
        });
    </script>

</body>
</html>
