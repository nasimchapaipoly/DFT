<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nasim IPTV</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/controls.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.ui.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0d0f;
    --surface: #16161a;
    --surface2: #1e1e24;
    --border: #2a2a33;
    --accent: #6c63ff;
    --accent2: #a78bfa;
    --text: #e8e8f0;
    --muted: #666680;
    --live: #22c55e;
    --error: #f43f5e;
  }

  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; }

  .app { display: grid; grid-template-columns: 300px 1fr; grid-template-rows: 48px 1fr; height: 100vh; }

  /* ── Top bar ── */
  .topbar {
    grid-column: 1 / -1;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 12px;
  }
  .logo { font-size: 15px; font-weight: 700; letter-spacing: 0.04em; color: var(--accent2); }
  .logo span { color: var(--text); }
  .topbar-search {
    margin-left: auto;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 10px;
    color: var(--text);
    font-size: 12px;
    width: 180px;
    outline: none;
    transition: border-color 0.2s;
  }
  .topbar-search:focus { border-color: var(--accent); }
  .channel-count { font-size: 11px; color: var(--muted); }

  /* ── Sidebar ── */
  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .category-tabs {
    display: flex;
    gap: 4px;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    scrollbar-width: none;
    flex-shrink: 0;
  }
  .category-tabs::-webkit-scrollbar { display: none; }
  .cat-btn {
    white-space: nowrap;
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
  }
  .cat-btn.active, .cat-btn:hover { background: var(--accent); border-color: var(--accent); color: #fff; }

  .channel-list { overflow-y: auto; flex: 1; padding: 6px; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  .channel-list::-webkit-scrollbar { width: 4px; }
  .channel-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .ch-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 7px;
    cursor: pointer;
    transition: background 0.12s;
    border: 1px solid transparent;
  }
  .ch-item:hover { background: var(--surface2); }
  .ch-item.active { background: var(--surface2); border-color: var(--accent); }
  .ch-logo {
    width: 36px; height: 36px;
    border-radius: 6px;
    background: var(--surface2);
    object-fit: contain;
    flex-shrink: 0;
    border: 1px solid var(--border);
  }
  .ch-logo-placeholder {
    width: 36px; height: 36px;
    border-radius: 6px;
    background: var(--surface2);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; flex-shrink: 0;
  }
  .ch-info { min-width: 0; }
  .ch-name { font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ch-group { font-size: 10px; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ── Player area ── */
  .player-area {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: #000;
  }

  .video-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16/9;
    max-height: calc(100vh - 48px - 90px);
    background: #000;
    flex-shrink: 0;
  }
  video { width: 100%; height: 100%; display: block; }

  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 12px; z-index: 10;
    background: rgba(0,0,0,0.75);
    transition: opacity 0.3s;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }

  .spinner { width: 36px; height: 36px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--accent2); border-radius: 50%; animation: spin 0.75s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .overlay-title { font-size: 13px; color: #aaa; }

  .error-overlay {
    position: absolute; inset: 0;
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 10px; z-index: 11;
    background: rgba(0,0,0,0.85);
  }
  .error-overlay.show { display: flex; }
  .error-icon { font-size: 32px; }
  .error-msg { font-size: 13px; color: #aaa; text-align: center; max-width: 280px; line-height: 1.5; }
  .retry-btn { padding: 7px 18px; background: var(--accent); color: #fff; border: none; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; }
  .retry-btn:hover { opacity: 0.85; }

  /* Now playing bar */
  .now-playing {
    padding: 10px 16px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  .np-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
  .np-dot.live { background: var(--live); animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .np-name { font-size: 13px; font-weight: 600; }
  .np-group { font-size: 11px; color: var(--muted); }
  .np-quality { margin-left: auto; font-size: 10px; color: var(--muted); }

  /* Empty state */
  .empty-state {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 10px; color: var(--muted);
  }
  .empty-state .big { font-size: 40px; }
  .empty-state p { font-size: 13px; }

  /* Loading sidebar */
  .sidebar-loading {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    flex: 1; gap: 10px; color: var(--muted); font-size: 12px;
  }

  @media (max-width: 600px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 48px auto 1fr; }
    .sidebar { grid-row: 3; border-right: none; border-top: 1px solid var(--border); }
    .video-wrap { aspect-ratio: 16/9; max-height: 40vh; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- Top bar -->
  <header class="topbar">
    <div class="logo">Nasim <span>IPTV</span></div>
    <span class="channel-count" id="ch-count">Loading…</span>
    <input class="topbar-search" type="text" id="search" placeholder="Search channels…">
  </header>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="category-tabs" id="cat-tabs"></div>
    <div class="channel-list" id="ch-list">
      <div class="sidebar-loading">
        <div class="spinner"></div>
        <span>Fetching playlist…</span>
      </div>
    </div>
  </aside>

  <!-- Player -->
  <main class="player-area" id="player-area">
    <div class="video-wrap" id="video-wrap">
      <video id="video" autoplay playsinline></video>
      <div class="overlay" id="loading-overlay">
        <div class="spinner"></div>
        <div class="overlay-title" id="loading-label">Select a channel</div>
      </div>
      <div class="error-overlay" id="error-overlay">
        <div class="error-icon">📡</div>
        <div class="error-msg" id="error-msg">Stream unavailable</div>
        <button class="retry-btn" onclick="retryChannel()">Retry</button>
      </div>
    </div>
    <div class="now-playing" id="now-playing">
      <div class="np-dot" id="np-dot"></div>
      <div>
        <div class="np-name" id="np-name">No channel selected</div>
        <div class="np-group" id="np-group">Choose a channel from the list</div>
      </div>
      <div class="np-quality" id="np-quality"></div>
    </div>
  </main>

</div>

<script>
const M3U_URL = 'https://www.dft.pro.bd/nasim.m3u';
const PROXY   = 'https://corsproxy.io/?';

let allChannels = [], filteredChannels = [], activeCategory = 'All';
let currentChannel = null, player = null;

// ── Parse M3U ────────────────────────────────────────────────────────────────
function parseM3U(text) {
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  const channels = [];
  let current = null;
  for (const line of lines) {
    if (line.startsWith('#EXTINF')) {
      current = { name: '', group: 'General', logo: '', url: '' };
      const nameMatch = line.match(/,(.+)$/);
      if (nameMatch) current.name = nameMatch[1].trim();
      const groupMatch = line.match(/group-title="([^"]*)"/i);
      if (groupMatch) current.group = groupMatch[1] || 'General';
      const logoMatch = line.match(/tvg-logo="([^"]*)"/i);
      if (logoMatch) current.logo = logoMatch[1];
    } else if (current && !line.startsWith('#')) {
      current.url = line;
      channels.push(current);
      current = null;
    }
  }
  return channels;
}

// ── Fetch playlist ────────────────────────────────────────────────────────────
async function fetchPlaylist() {
  let text = null;
  // try direct first, then proxy
  try {
    const r = await fetch(M3U_URL, { cache: 'no-cache' });
    if (r.ok) text = await r.text();
  } catch(_) {}

  if (!text) {
    try {
      const r = await fetch(PROXY + encodeURIComponent(M3U_URL));
      if (r.ok) text = await r.text();
    } catch(_) {}
  }

  if (!text) throw new Error('Could not fetch playlist');
  return parseM3U(text);
}

// ── Render sidebar ────────────────────────────────────────────────────────────
function renderCategories(channels) {
  const groups = ['All', ...new Set(channels.map(c => c.group))].slice(0, 20);
  const tabs = document.getElementById('cat-tabs');
  tabs.innerHTML = groups.map(g =>
    `<button class="cat-btn${g === activeCategory ? ' active' : ''}" onclick="selectCategory('${g.replace(/'/g,"\\'")}'')">${g}</button>`
  ).join('');
}

function selectCategory(g) {
  activeCategory = g;
  renderCategories(allChannels);
  applyFilter();
}

function applyFilter() {
  const q = document.getElementById('search').value.toLowerCase();
  filteredChannels = allChannels.filter(c => {
    const matchCat = activeCategory === 'All' || c.group === activeCategory;
    const matchQ = !q || c.name.toLowerCase().includes(q) || c.group.toLowerCase().includes(q);
    return matchCat && matchQ;
  });
  renderChannelList();
}

function renderChannelList() {
  const list = document.getElementById('ch-list');
  if (!filteredChannels.length) {
    list.innerHTML = '<div style="padding:20px;text-align:center;color:var(--muted);font-size:12px;">No channels found</div>';
    return;
  }
  list.innerHTML = filteredChannels.map((c, i) => {
    const isActive = currentChannel && currentChannel.url === c.url;
    const logo = c.logo
      ? `<img class="ch-logo" src="${c.logo}" onerror="this.style.display='none';this.nextSibling.style.display='flex'" loading="lazy"><div class="ch-logo-placeholder" style="display:none">📺</div>`
      : `<div class="ch-logo-placeholder">📺</div>`;
    return `<div class="ch-item${isActive ? ' active' : ''}" onclick="playChannel(${allChannels.indexOf(c)})">
      ${logo}
      <div class="ch-info">
        <div class="ch-name">${escHtml(c.name)}</div>
        <div class="ch-group">${escHtml(c.group)}</div>
      </div>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Shaka Player ──────────────────────────────────────────────────────────────
async function initShaka() {
  shaka.polyfill.installAll();
  const video = document.getElementById('video');
  const container = document.getElementById('video-wrap');
  player = new shaka.Player(video);
  new shaka.ui.Overlay(player, container, video);

  player.configure({
    streaming: { bufferingGoal: 10, rebufferingGoal: 2,
      retryParameters: { maxAttempts: 3, baseDelay: 500, backoffFactor: 2 }
    }
  });

  player.addEventListener('error', e => {
    showError('Stream error (code ' + e.detail.code + '). Try another channel or retry.');
  });
  player.addEventListener('buffering', e => {
    if (!e.buffering) {
      hideLoading(); hideError();
      document.getElementById('np-dot').classList.add('live');
      updateQuality();
    }
  });
  video.addEventListener('playing', () => {
    hideLoading(); hideError();
    document.getElementById('np-dot').classList.add('live');
  });
}

async function playChannel(idx) {
  const ch = allChannels[idx];
  if (!ch) return;
  currentChannel = ch;
  renderChannelList();

  document.getElementById('np-name').textContent = ch.name;
  document.getElementById('np-group').textContent = ch.group;
  document.getElementById('np-quality').textContent = '';
  document.getElementById('np-dot').classList.remove('live');

  showLoading('Connecting to ' + ch.name + '…');
  hideError();

  try {
    await player.unload();
    await player.load(ch.url);
  } catch(e) {
    showError('Could not load "' + ch.name + '". The stream may be offline or geo-restricted.');
  }
}

function retryChannel() {
  if (currentChannel) {
    const idx = allChannels.indexOf(currentChannel);
    if (idx >= 0) playChannel(idx);
  }
}

function showLoading(msg) {
  document.getElementById('loading-label').textContent = msg || 'Loading…';
  document.getElementById('loading-overlay').classList.remove('hidden');
}
function hideLoading() { document.getElementById('loading-overlay').classList.add('hidden'); }
function showError(msg) {
  hideLoading();
  document.getElementById('error-msg').textContent = msg;
  document.getElementById('error-overlay').classList.add('show');
}
function hideError() { document.getElementById('error-overlay').classList.remove('show'); }

function updateQuality() {
  const t = (player.getVariantTracks() || []).find(t => t.active);
  if (t) document.getElementById('np-quality').textContent = t.width ? `${t.width}×${t.height}` : '';
}

// ── Boot ──────────────────────────────────────────────────────────────────────
document.getElementById('search').addEventListener('input', applyFilter);

document.addEventListener('shaka-ui-loaded', async () => {
  await initShaka();

  try {
    allChannels = await fetchPlaylist();
    document.getElementById('ch-count').textContent = allChannels.length + ' channels';
    renderCategories(allChannels);
    filteredChannels = [...allChannels];
    renderChannelList();
    // Show idle state on player
    document.getElementById('loading-label').textContent = 'Select a channel to watch';
  } catch(e) {
    document.getElementById('ch-list').innerHTML =
      '<div style="padding:20px;text-align:center;color:var(--error);font-size:12px;">Failed to load playlist.<br>Check the URL or your connection.</div>';
    document.getElementById('ch-count').textContent = 'Error';
  }
});
</script>
</body>
</html>
