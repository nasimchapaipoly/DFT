<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DFT Live TV - Working Test</title>
    
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@clappr/player@latest/dist/clappr.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/dash-shaka-playback@latest/dist/dash-shaka-playback.min.js"></script>
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        #player {
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>
<body>

    <div id="player"></div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Using an unencrypted public reference DASH stream to verify player logic
            const workingTestMpd = "https://dash.akamaized.net/akamai/test/isoffm/Is there any way to change the aspect ratio on a dash.mpd";

            var player = new Clappr.Player({
                source: workingTestMpd,
                parentId: "#player",
                plugins: [DashShakaPlayback],
                shakaPlayback: {
                    crossOrigin: 'anonymous'
                },
                preload: 'auto',
                autoPlay: true,
                muted: true, // Bypass mobile autoplay blocks
                width: '100%',
                height: '100%',
                mimeType: 'application/dash+xml'
            });
        });
    </script>

</body>
</html>
