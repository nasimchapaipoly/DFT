<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Under Construction</title>

<style>
:root {
    --primary-green: #116530;
    --primary-yellow: #F4D160;
}

/* BODY */
body {
    margin: 0;
    font-family: Arial;
    background: #f4f4f4;
}

/* CARD */
.wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.card {
    background: white;
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    max-width: 500px;
    width: 90%;
    box-shadow: 0 20px 40px rgba(0,0,0,0.1);
    animation: fadeUp 0.7s ease;
}

h1 {
    color: var(--primary-green);
}

/* COUNTDOWN */
.countdown {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 20px 0;
}
.countdown div {
    background: #eee;
    padding: 10px;
    border-radius: 10px;
}

/* PROGRESS */
.progress-box {
    background: #eee;
    height: 10px;
    border-radius: 10px;
}
.progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--primary-green), var(--primary-yellow));
}

/* FORM */
form {
    margin-top: 20px;
}
input {
    padding: 10px;
    border-radius: 20px;
    border: 1px solid #ccc;
}
button {
    padding: 10px 15px;
    border: none;
    border-radius: 20px;
    background: var(--primary-green);
    color: white;
    cursor: pointer;
}

/* DARK MODE */
.dark {
    background: #111;
    color: white;
}
.dark .card {
    background: #222;
}

/* ANIMATION */
@keyframes fadeUp {
    from {opacity:0; transform:translateY(30px);}
    to {opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>

<div class="wrapper">
<div class="card">

<h1>🚧 Under Construction</h1>

<p>We are building something awesome. Stay tuned!</p>

<!-- COUNTDOWN -->
<div class="countdown">
<div><span id="d">00</span><br>Days</div>
<div><span id="h">00</span><br>Hours</div>
<div><span id="m">00</span><br>Min</div>
<div><span id="s">00</span><br>Sec</div>
</div>

<!-- PROGRESS -->
<div class="progress-box">
<div class="progress-bar" id="bar"></div>
</div>
<p id="progress-text">0%</p>

<!-- FORM -->
<form onsubmit="saveEmail(event)">
<input type="email" id="email" placeholder="Enter email" required>
<button>Notify Me</button>
</form>

<p id="msg"></p>

<!-- DARK MODE -->
<button onclick="toggleDark()">🌙 Dark Mode</button>

</div>
</div>

<script>
// COUNTDOWN
const launch = new Date("2026-01-01").getTime();
setInterval(()=>{
    let now = new Date().getTime();
    let gap = launch - now;

    let d = Math.floor(gap/(1000*60*60*24));
    let h = Math.floor((gap/(1000*60*60))%24);
    let m = Math.floor((gap/(1000*60))%60);
    let s = Math.floor((gap/1000)%60);

    document.getElementById("d").innerText = d;
    document.getElementById("h").innerText = h;
    document.getElementById("m").innerText = m;
    document.getElementById("s").innerText = s;
},1000);

// PROGRESS
let p = 0;
setInterval(()=>{
    if(p<100){
        p += Math.random()*5;
        document.getElementById("bar").style.width = p+"%";
        document.getElementById("progress-text").innerText = Math.floor(p)+"%";
    }
},800);

// EMAIL
function saveEmail(e){
    e.preventDefault();
    let email = document.getElementById("email").value;
    document.getElementById("msg").innerText = "Saved!";
    document.getElementById("email").value = "";
    console.log(email);
}

// DARK MODE
function toggleDark(){
    document.body.classList.toggle("dark");
}
</script>

</body>
</html>
