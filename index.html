<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Construction | Nasim Al Masud</title>
    <style>
        :root {
            /* Color Palette */
            --primary-color: #2563eb;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --bg-gradient: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
            --card-bg: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            padding: 1rem;
        }

        .container {
            background: var(--card-bg);
            padding: 4rem 3rem;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

        .brand {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2.5px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        p {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }

        .url-badge {
            display: inline-block;
            background: #f8fafc;
            padding: 0.75rem 1.75rem;
            border-radius: 9999px;
            font-weight: 600;
            font-size: 1.05rem;
            color: var(--primary-color);
            margin-bottom: 3rem;
            border: 1px solid #e2e8f0;
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.02);
        }

        .loader {
            width: 45px;
            height: 45px;
            border: 4px solid #f3f4f6;
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            margin: 0 auto;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Responsive Design */
        @media (max-width: 640px) {
            .container {
                padding: 3rem 1.5rem;
            }
            h1 {
                font-size: 2rem;
            }
            p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="brand">DFT - Department of Food Technology</div>
        <h1>Site Is Under Construction</h1>
        <p>We are currently building this website. Development is in progress to bring you a refined digital experience very soon.</p>
        <div class="url-badge"> You can visit developer site <a href="https://www.nasim.ami.bd"> Nasim Al Masud</a> </div>
        <div class="loader"></div>
    </div>
</body>
</html>
