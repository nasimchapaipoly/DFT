<!DOCTYPE html>
<html lang="bn">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>উপস্থিতি ফরম জেনারেটর</title>

<style>

/* ========================= */
/* বাংলা ফন্ট */
/* ========================= */

@font-face{
    font-family:"SutonnyMJ";
    src:local("SutonnyMJ");
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"SutonnyMJ", Arial, sans-serif;
}

body{
    background:#ececec;
    padding:10px;
}



/* ========================= */
/* CONTROL PANEL */
/* ========================= */

.controls{

    width:100%;
    max-width:1000px;

    margin:auto;
    margin-bottom:15px;

    background:#ffffff;

    padding:15px;

    border-radius:8px;

    border:1px solid #dcdcdc;

}

.controls h2{

    text-align:center;

    margin-bottom:15px;

    font-size:28px;

}

.form-group{

    display:flex;

    gap:12px;

    justify-content:center;

    flex-wrap:wrap;

}

select,
button{

    padding:10px 16px;

    font-size:16px;

    border-radius:5px;

    border:1px solid #bdbdbd;

    outline:none;

}

button{

    background:#0066cc;

    color:#fff;

    cursor:pointer;

    border:none;

}

button:hover{

    background:#004999;

}



/* ========================= */
/* A4 PAGE */
/* ========================= */

.a4-page{

    width:210mm;

    min-height:297mm;

    margin:auto;

    background:#fff;

    padding:6mm;

    border:1px solid #d0d0d0;

    border-radius:4px;

}



/* ========================= */
/* HEADER */
/* ========================= */

.header{

    text-align:center;

    margin-bottom:10px;

    border:1px solid #d9d9d9;

    padding:8px;

    border-radius:4px;

}

.header h2{

    font-size:30px;

    margin-bottom:3px;

}

.header h4{

    font-size:16px;

    margin-bottom:5px;

}

.header h3{

    font-size:22px;

    margin-bottom:4px;

}

.header p{

    font-size:18px;

    font-weight:bold;

}



/* ========================= */
/* TABLE */
/* ========================= */

table{

    width:100%;

    border-collapse:collapse;

}

table th,
table td{

    border:1px solid #555;

    padding:7px;

    text-align:center;

    font-size:13px;

}

thead th{

    background:#f7f7f7;

    font-weight:bold;

}



/* ========================= */
/* NAME COLUMN */
/* ========================= */

.name-column{

    width:260px;

    text-align:left;

    padding-left:10px;

}



/* ========================= */
/* SUBJECT BOX */
/* ========================= */

.subject-box{

    width:58px;

    height:45px;

}



/* ========================= */
/* SIGNATURE */
/* ========================= */

.signature{

    margin-top:55px;

    display:flex;

    justify-content:space-between;

}

.signature div{

    width:220px;

    text-align:center;

}

.signature .line{

    border-top:1px solid #555;

    margin-bottom:6px;

}



/* ========================= */
/* PRINT */
/* ========================= */

@media print{

    body{

        background:#fff;

        padding:0;

    }

    .controls{

        display:none;

    }

    .a4-page{

        width:100%;

        margin:0;

        border:none;

    }

    @page{

        size:A4;

        margin:5mm;

    }

}

</style>
</head>

<body>



<!-- ========================= -->
<!-- CONTROL PANEL -->
<!-- ========================= -->

<div class="controls">

    <h2>উপস্থিতি ফরম জেনারেটর</h2>

    <div class="form-group">


        <!-- TECHNOLOGY -->

        <select id="technology">

            <option value="">

            <option value="Food Technology">

            </option>

                মেকাট্রনিক্স টেকনোলজি
            </option>

            <option value="Electronics Technology">
                ইলেকট্রনিক্স টেকনোলজি
            </option>

            <option value="RAC Technology">
                আরএসি টেকনোলজি
            </option>

        </select>



        <!-- SEMESTER -->

        <select id="semester">

            <option value="">
                সেমিস্টার নির্বাচন করুন
            </option>

            <option value="1st">১ম সেমিস্টার</option>
            <option value="2nd">২য় সেমিস্টার</option>
            <option value="3rd">৩য় সেমিস্টার</option>
            <option value="4th">৪র্থ সেমিস্টার</option>
            <option value="5th">৫ম সেমিস্টার</option>
            <option value="6th">৬ষ্ঠ সেমিস্টার</option>
            <option value="7th">৭ম সেমিস্টার</option>
            <option value="8th">৮ম সেমিস্টার</option>

        </select>



        <button onclick="generateForm()">
            ফরম জেনারেট
        </button>

        <button onclick="window.print()">
            প্রিন্ট
        </button>

    </div>

</div>



<!-- ========================= -->
<!-- PRINT AREA -->
<!-- ========================= -->

<!-- শুরুতে hidden থাকবে -->

<div class="a4-page" id="printArea" style="display:none;">

    <div class="header">

                <th class="subject-box"></th>
                <th class="subject-box"></th>

                <th class="subject-box"></th>

            </tr>

        </thead>



        <tbody id="studentTable">

    </table>




    <!-- ========================= -->
    <!-- SIGNATURE -->
    <!-- ========================= -->

    <div class="signature">

        <div>

            <div class="line"></div>

        <div>

</div>

/* ========================= */
/* GENERATE FORM */
/* ========================= */

function generateForm(){

    const technology =
        document.getElementById("technology").value;

    const semester =
        document.getElementById("semester").value;


    if(!technology || !semester){

        alert("টেকনোলজি ও সেমিস্টার নির্বাচন করুন");

        return;
    }


    /* ========================= */
    /* SHOW FORM */
    /* ========================= */

    document.getElementById("printArea").style.display = "block";


    const filteredStudents = students.filter(student =>

        student.technology === technology &&
        student.semester === semester

    );


    document.getElementById("titleText").innerHTML =

        technologyNames[technology] +

        " - " +

        semesterNames[semester] +

        " সেমিস্টার";


    const tableBody =
        document.getElementById("studentTable");


    tableBody.innerHTML = "";


    if(filteredStudents.length === 0){

        tableBody.innerHTML = `

        <tr>

            <td colspan="14">

                কোনো স্টুডেন্ট পাওয়া যায়নি

            </td>

        </tr>

        `;

        return;
    }



    filteredStudents.forEach((student, index) => {

        let row = `

        <tr>

            <td>${index + 1}</td>

            <td>${student.roll}</td>

            <td class="name-column">

                ${student.name}

            </td>

            <td>${student.gpa}</td>

            <td class="subject-box"></td>
            <td class="subject-box"></td>
            <td class="subject-box"></td>
            <td class="subject-box"></td>
            <td class="subject-box"></td>
            <td class="subject-box"></td>
            <td class="subject-box"></td>
            <td class="subject-box"></td>

            <td></td>

            <td></td>

        </tr>

        `;

        tableBody.innerHTML += row;

    });

}
