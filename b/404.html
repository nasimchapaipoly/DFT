<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Page Not Found</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #f3f4f6, #e5e7eb);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.container {
    text-align: center;
}

h1 {
    font-size: 80px;
    margin: 0;
    color: #2563eb;
}

p {
    font-size: 18px;
    color: #555;
}

.btn {
    margin-top: 20px;
    padding: 10px 20px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 8px;
    text-decoration: none;
}

.countdown {
    margin-top: 10px;
    font-size: 14px;
    color: #777;
}
</style>

</head>
<body>

<div class="container">
    <h1>404</h1>
    <p>Oops! Page not found</p>

    <a href="index.html" class="btn">🏠 Go Home</a>

    <div class="countdown">
        Redirecting in <span id="timer">5</span> seconds...
    </div>
</div>

<script>
// ⏳ Countdown + Redirect
let time = 5;

const timerEl = document.getElementById("timer");

const interval = setInterval(() => {
    time--;
    timerEl.textContent = time;

    if (time <= 0) {
        clearInterval(interval);
        window.location.href = "index.html";
    }
}, 1000);
</script>

</body>
</html>
